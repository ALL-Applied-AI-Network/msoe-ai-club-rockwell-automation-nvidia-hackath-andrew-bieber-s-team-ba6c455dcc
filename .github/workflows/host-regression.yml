name: Host regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  padded-finger-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test padded-finger configuration
        run: python -m unittest -v tests/test_padded_fingers_config.py
